name: CI

on:
  push:
    branches: [docs/documentations]
  pull_request:

jobs:
  book:
    name: Book (build + sitemap)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: Build book
        run: mdbook build docs
      - name: Regenerate sitemap.xml
        run: node docs/scripts/postbuild.mjs

  figures:
    name: Figures (mirrored from the code branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the book branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The book is pinned to the exact code revision that produced its
      # mirrored figures. The pin is a commit, so it stays reachable after the
      # code branch is merged and deleted; a book change updates the pin when it
      # regenerates the figures.
      - name: Read the pinned code revision
        id: pinned
        run: echo "commit=$(cat docs/figures-source-commit)" >> "$GITHUB_OUTPUT"
      - name: Checkout the code from the pinned revision
        uses: actions/checkout@v6
        with:
          repository: neurono-ml/scienceview
          ref: ${{ steps.pinned.outputs.commit }}
          path: code
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Regenerate the figures with the tool itself
        working-directory: code
        run: |
          shopt -s nullglob
          examples=(examples/*.rs)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "no example programs found under examples/" >&2
            exit 1
          fi
          for example in "${examples[@]}"; do
            cargo run --example "$(basename "${example}" .rs)"
          done
      - name: The mirrored figures must match the code branch
        run: |
          # The code branch owns the figures; its path moved once already, so
          # the job resolves it instead of assuming one.
          figures_directory=""
          for candidate in code/docs/figures code/docs/src/assets; do
            if [ -d "$candidate" ]; then
              figures_directory="$candidate"
              break
            fi
          done
          if [ -z "$figures_directory" ]; then
            echo "No figures found in the code checkout — nothing to compare." >&2
            exit 1
          fi
          diff -r --brief "$figures_directory" docs/src/assets

  code:
    name: Code (only when this branch carries the workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build and test the workspace, when this branch carries it
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace --all-targets
          else
            echo "This branch carries the book only — nothing to build."
          fi

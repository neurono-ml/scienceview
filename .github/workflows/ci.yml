name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: Static analysis (clippy, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain (clippy)
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Workspace tests + doctests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace --all-targets
        run: cargo test --workspace --all-targets

  examples:
    name: Examples (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo build --examples
        run: cargo build --workspace --examples --features render-svg
      - name: cargo test --examples
        run: cargo test --workspace --examples --features render-svg

  figures:
    name: Figures (tool-generated, no drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Regenerate figures with the tool itself
        run: |
          shopt -s nullglob
          examples=(examples/*.rs)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "no example programs found under examples/" >&2
            exit 1
          fi
          for example in "${examples[@]}"; do
            # Every example builds with the SVG backend feature enabled; an
            # example whose target declares `required-features` (the charts
            # that call the public serializers) needs it.
            cargo run --example "$(basename "${example}" .rs)" --features render-svg
          done
      - name: Checked-in figures must match tool output
        run: |
          git diff --exit-code -- docs/figures
          if [ -n "$(git status --porcelain --untracked-files=all -- docs/figures)" ]; then
            echo "docs/figures must contain exactly the figures the examples produce" >&2
            git status --short --untracked-files=all -- docs/figures
            exit 1
          fi

  msrv:
    name: MSRV gate (exact 1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install exact Rust 1.85 toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo build + test on exact 1.85
        run: |
          cargo build --workspace --all-targets
          cargo test --workspace --all-targets

  features:
    name: Optional features (clippy + tests, all features)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain (clippy)
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets --all-features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test --workspace --all-targets --all-features
        run: cargo test --workspace --all-targets --all-features

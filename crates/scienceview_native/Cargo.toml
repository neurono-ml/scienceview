[package]
name = "scienceview_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "from-scratch native window rendering backend for scienceview."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/scienceview_native"

[features]
default = []
# The window/present layer: winit and softbuffer stay out of every build that
# does not ask for them. The pure rasterizer compiles without this feature.
window = ["dep:winit", "dep:softbuffer"]

[dependencies]
scienceview_core = { path = "../scienceview_core", version = "0.1.0" }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true

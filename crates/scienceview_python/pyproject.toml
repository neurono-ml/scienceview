[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "scienceview"
description = "Scientific visualization for Python: builder-style figures with explicit backends and streaming updates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Visualization",
]

[tool.maturin]
# The interpreter layer and the loadable-module shape are both opt-in features;
# a plain `cargo build` never pulls `pyo3`.
features = ["python", "extension-module"]
module-name = "scienceview"

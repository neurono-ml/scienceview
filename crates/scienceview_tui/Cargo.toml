[package]
name = "scienceview_tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "terminal (TUI) rendering backend for scienceview."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/scienceview_tui"

[features]
default = []
# The interactive terminal layer: ratatui and crossterm stay out of every build
# that does not ask for them. The pure cell rasterizer compiles without this
# feature, so the golden-frame tests run headless.
terminal = ["dep:ratatui", "dep:crossterm"]

[dependencies]
scienceview_core = { path = "../scienceview_core", version = "0.1.0" }
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", optional = true }

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[lints]
workspace = true

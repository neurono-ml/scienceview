[package]
name = "scienceview_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dependency-light core of scienceview: the figure model, data boundary, kernels and layout."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/scienceview_core"

[features]
default = []
# Zero-copy views over `ndarray` arrays.
data-ndarray = ["dep:ndarray"]
# Zero-copy views over `sprs` sparse vectors.
data-sprs = ["dep:sprs"]
# Live updates over standard-library channels; no extra dependency.
streaming = []
# Live updates fed by Tokio channels; the core still owns no async runtime.
streaming-tokio = ["dep:tokio"]
# Read compiled design tokens (colours, palettes, spacing) from `scienceview_theme`.
theme = ["dep:scienceview_theme"]

[dependencies]
thiserror = "2"
tracing = "0.1"
ndarray = { version = "0.17", optional = true }
sprs = { version = "0.11", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["sync"] }
scienceview_theme = { path = "../scienceview_theme", version = "0.1.0", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true

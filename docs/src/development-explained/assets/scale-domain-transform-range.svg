<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1060 660" role="img" aria-label="The scale kernel: domain, transform, range and ticks">
  <defs>
    <marker id="scale-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
    <marker id="scale-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e07a1f"/>
    </marker>
    <marker id="scale-arrow-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="660" fill="#ffffff"/>

  <text x="530" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3557">
    One scale owns the domain and the range
  </text>

  <!-- Pipeline -->
  <text x="30" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#457b9d">
    1. THE PROJECTION: DOMAIN -> TRANSFORM -> RANGE
  </text>

  <rect x="30" y="86" width="200" height="96" rx="12" fill="#457b9d" stroke="#1d3557" stroke-width="2"/>
  <text x="130" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SVColumnView</text>
  <text x="130" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e8f1f7">Dense / Sparse / Streaming</text>
  <text x="130" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e8f1f7">dispatched exactly once</text>

  <line x1="230" y1="134" x2="272" y2="134" stroke="#1d3557" stroke-width="2.5" marker-end="url(#scale-arrow)"/>

  <rect x="276" y="86" width="210" height="96" rx="12" fill="#2a9d8f" stroke="#1b6f65" stroke-width="2"/>
  <text x="381" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SVDomain</text>
  <text x="381" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e4f6f2">explicit when configured</text>
  <text x="381" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e4f6f2">derived from the column</text>

  <line x1="486" y1="134" x2="528" y2="134" stroke="#1d3557" stroke-width="2.5" marker-end="url(#scale-arrow)"/>

  <rect x="532" y="86" width="234" height="96" rx="12" fill="#e07a1f" stroke="#a9530c" stroke-width="2"/>
  <text x="649" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SVScaleTransform</text>
  <text x="649" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffeadd">Linear / Logarithmic</text>
  <text x="649" y="149" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffeadd">SymmetricLogarithmic / SquareRoot</text>
  <text x="649" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffeadd">forward and inverse</text>

  <line x1="766" y1="134" x2="808" y2="134" stroke="#1d3557" stroke-width="2.5" marker-end="url(#scale-arrow)"/>

  <rect x="812" y="86" width="218" height="96" rx="12" fill="#ef476f" stroke="#b5173d" stroke-width="2"/>
  <text x="921" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SVScaleRange</text>
  <text x="921" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffe3ec">display interval start .. end</text>
  <text x="921" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffe3ec">reversed = inverted axis</text>

  <text x="30" y="206" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057">
    position = range.interpolate( numerator / denominator ) and inverse_position walks the same line back to a data value.
  </text>

  <!-- Ticks -->
  <text x="30" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#457b9d">
    2. TICKS: THE LAYOUT ENGINE GRANTS THE SPACE
  </text>

  <rect x="30" y="266" width="230" height="92" rx="12" fill="#ffd166" stroke="#b8860b" stroke-width="2"/>
  <text x="145" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3557">SVTickSpace</text>
  <text x="145" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3d3d3d">available length</text>
  <text x="145" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3d3d3d">minimum label spacing</text>

  <line x1="260" y1="312" x2="302" y2="312" stroke="#b8860b" stroke-width="2.5" marker-end="url(#scale-arrow-accent)"/>

  <rect x="306" y="266" width="230" height="92" rx="12" fill="#f4a261" stroke="#a9530c" stroke-width="2"/>
  <text x="421" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3557">tick budget</text>
  <text x="421" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3d3d3d">floor(length / spacing)</text>
  <text x="421" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3d3d3d">explicit count overrides it</text>

  <line x1="536" y1="312" x2="578" y2="312" stroke="#a9530c" stroke-width="2.5" marker-end="url(#scale-arrow-accent)"/>

  <rect x="582" y="266" width="210" height="92" rx="12" fill="#a9530c" stroke="#703506" stroke-width="2"/>
  <text x="687" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SVTick</text>
  <text x="687" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffeadd">value, position, label</text>
  <text x="687" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffeadd">narrow axis, fewer ticks</text>

  <text x="30" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057">
    Continuous ticks land on 1/2/5 steps, logarithmic ticks on integer exponents, temporal ticks on a readable unit ladder.
  </text>

  <!-- Colour -->
  <text x="30" y="428" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#457b9d">
    3. COLOUR: STABLE FOR CATEGORIES, INTERPOLATED FOR VALUES
  </text>

  <rect x="30" y="444" width="450" height="92" rx="12" fill="#9b5de5" stroke="#5f2c91" stroke-width="2"/>
  <text x="255" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SVScalePalette (nominal)</text>
  <text x="255" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#f3e9ff">one entry per assignment index, never interpolated</text>
  <text x="255" y="510" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#f3e9ff">default palette without the theme feature; theme token with it</text>

  <rect x="510" y="444" width="520" height="92" rx="12" fill="#118ab2" stroke="#0b5e7a" stroke-width="2"/>
  <text x="770" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SVColourMap (continuous)</text>
  <text x="770" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e2f5fb">interpolates its stops; re-resolved from the theme per call</text>
  <text x="770" y="510" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e2f5fb">so a theme recompilation restyles every continuous encoding</text>

  <!-- Kinds -->
  <text x="30" y="578" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#457b9d">
    4. THE CLOSED MODEL: FOUR KINDS, NO AUTOMATIC CHOICE
  </text>

  <rect x="30" y="592" width="230" height="42" rx="21" fill="#2a9d8f"/>
  <text x="145" y="619" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Continuous</text>

  <rect x="276" y="592" width="230" height="42" rx="21" fill="#9b5de5"/>
  <text x="391" y="619" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Nominal</text>

  <rect x="522" y="592" width="230" height="42" rx="21" fill="#e07a1f"/>
  <text x="637" y="619" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Temporal</text>

  <rect x="768" y="592" width="230" height="42" rx="21" fill="#ef476f"/>
  <text x="883" y="619" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Boolean</text>
</svg>

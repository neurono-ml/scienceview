<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" role="img" aria-labelledby="title description">
  <title id="title">The bounded keyframe window and interruptible re-targeting</title>
  <desc id="description">The top panel shows a transition from keyframe A at 0 milliseconds to keyframe B at 1000 milliseconds with the playhead at 500 milliseconds. A new keyframe C arrives at 750 milliseconds. The bottom panel shows the re-targeted timeline: A, the recorded state S at 500 milliseconds, and C at 750 milliseconds; B was dropped as a superseded target. A third panel shows the streaming window retaining only the newest four keyframes.</desc>
  <style>
    .title { font: 700 22px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1c2733; }
    .panel { font: 700 15px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1c2733; }
    .note { font: 400 13px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #4a5866; }
    .frame { font: 700 13px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .stamp { font: 400 11px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #4a5866; }
    .flow { stroke: #5d6b78; stroke-width: 2.5; fill: none; }
    .transit { stroke: #118ab2; stroke-width: 5; stroke-linecap: round; }
    .newtransit { stroke: #2a9d8f; stroke-width: 5; stroke-linecap: round; }
    .dropped { stroke: #b9c3cc; stroke-width: 3; stroke-dasharray: 6 6; }
    .label { font: 600 12px "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b78"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.12" flood-color="#1c2733"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="620" rx="18" fill="#f7fafc"/>
  <text class="title" x="36" y="42">Arrivals, pre-emption and the bounded window</text>
  <text class="note" x="36" y="64">Time is the caller's: every tick is advance(Duration), and a playhead at 500 ms is the same frame everywhere.</text>

  <text class="panel" x="36" y="104">1. The window and the bounded queue</text>
  <g filter="url(#soft)">
    <rect x="36" y="118" width="866" height="92" rx="14" fill="#ffffff" stroke="#d5dde5"/>
    <rect x="58" y="140" width="96" height="48" rx="10" fill="#f1f4f7" stroke="#b9c3cc" stroke-width="2"/>
    <text class="frame" x="106" y="160" text-anchor="middle" fill="#7a8794">k1 … k6</text>
    <text class="stamp" x="106" y="177" text-anchor="middle">evicted (+6)</text>
    <rect x="174" y="140" width="96" height="48" rx="10" fill="#eef7ee" stroke="#2a9d8f" stroke-width="2"/>
    <text class="frame" x="222" y="169" text-anchor="middle" fill="#12403a">k7</text>
    <rect x="290" y="140" width="96" height="48" rx="10" fill="#eef7ee" stroke="#2a9d8f" stroke-width="2"/>
    <text class="frame" x="338" y="169" text-anchor="middle" fill="#12403a">k8</text>
    <rect x="406" y="140" width="96" height="48" rx="10" fill="#eef7ee" stroke="#2a9d8f" stroke-width="2"/>
    <text class="frame" x="454" y="169" text-anchor="middle" fill="#12403a">k9</text>
    <rect x="522" y="140" width="96" height="48" rx="10" fill="#e3f2fd" stroke="#118ab2" stroke-width="2.5"/>
    <text class="frame" x="570" y="160" text-anchor="middle" fill="#0b3c5d">k10</text>
    <text class="stamp" x="570" y="177" text-anchor="middle">newest</text>
    <text class="note" x="650" y="152">capacity = 4</text>
    <text class="note" x="650" y="172">the oldest frame leaves first,</text>
    <text class="note" x="650" y="190">deterministically and counted</text>
  </g>

  <text class="panel" x="36" y="258">2. Interruptible re-targeting, before the arrival</text>
  <g filter="url(#soft)">
    <rect x="36" y="272" width="866" height="108" rx="14" fill="#ffffff" stroke="#d5dde5"/>
    <rect x="70" y="308" width="120" height="52" rx="12" fill="#fff4e6" stroke="#f4a261" stroke-width="2.5"/>
    <text class="frame" x="130" y="330" text-anchor="middle" fill="#6b3a12">A</text>
    <text class="stamp" x="130" y="348" text-anchor="middle">0 ms</text>
    <rect x="470" y="308" width="120" height="52" rx="12" fill="#e3f2fd" stroke="#118ab2" stroke-width="2.5"/>
    <text class="frame" x="530" y="330" text-anchor="middle" fill="#0b3c5d">B</text>
    <text class="stamp" x="530" y="348" text-anchor="middle">1000 ms · pending target</text>
    <line class="transit" x1="190" y1="334" x2="465" y2="334" marker-end="url(#tip)"/>
    <circle cx="380" cy="334" r="10" fill="#ef4766" stroke="#ffffff" stroke-width="3"/>
    <text class="label" x="380" y="299" text-anchor="middle" fill="#8f2340">playhead 500 ms · state S</text>
    <text class="note" x="660" y="330">the marks are halfway</text>
    <text class="note" x="660" y="348">between A and B</text>
  </g>

  <text class="panel" x="36" y="418">3. C arrives at 750 ms: the state S becomes the new origin</text>
  <g filter="url(#soft)">
    <rect x="36" y="432" width="866" height="118" rx="14" fill="#ffffff" stroke="#d5dde5"/>
    <rect x="70" y="468" width="120" height="52" rx="12" fill="#fff4e6" stroke="#f4a261" stroke-width="2.5"/>
    <text class="frame" x="130" y="490" text-anchor="middle" fill="#6b3a12">A</text>
    <text class="stamp" x="130" y="508" text-anchor="middle">0 ms</text>
    <rect x="330" y="468" width="120" height="52" rx="12" fill="#fde8ef" stroke="#ef4766" stroke-width="2.5"/>
    <text class="frame" x="390" y="490" text-anchor="middle" fill="#6b0f2a">S</text>
    <text class="stamp" x="390" y="508" text-anchor="middle">500 ms · recorded</text>
    <rect x="590" y="468" width="130" height="52" rx="12" fill="#eef7ee" stroke="#2a9d8f" stroke-width="2.5"/>
    <text class="frame" x="655" y="490" text-anchor="middle" fill="#12403a">C</text>
    <text class="stamp" x="655" y="508" text-anchor="middle">750 ms · new target</text>
    <line class="newtransit" x1="190" y1="494" x2="325" y2="494" marker-end="url(#tip)"/>
    <line class="newtransit" x1="450" y1="494" x2="585" y2="494" marker-end="url(#tip)"/>
    <rect x="780" y="478" width="86" height="36" rx="10" fill="#f1f4f7" stroke="#b9c3cc" stroke-width="2" stroke-dasharray="5 4"/>
    <text class="frame" x="823" y="501" text-anchor="middle" fill="#7a8794">B dropped</text>
    <line class="dropped" x1="724" y1="494" x2="775" y2="494" marker-end="url(#tip)"/>
    <text class="note" x="740" y="545">sampling at 500 ms before and after C agrees: no jump</text>
  </g>

  <text class="note" x="36" y="592">Every accepted, duplicate, out-of-order and evicted arrival increments its own counter on the timeline.</text>
</svg>

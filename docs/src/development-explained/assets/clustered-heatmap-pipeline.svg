<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="The clustered heatmap pipeline: the caller supplies the matrix, the orders and the merge trees; the recipe validates and draws them">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a9d8f"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="300" fill="#fdfdfb"/>
  <text x="480" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1f2328">The clustering is an input, not a computation</text>

  <!-- Caller side -->
  <rect x="30" y="70" width="250" height="190" rx="12" fill="#e3f2fd" stroke="#118ab2" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0b3c5d">Caller / model layer</text>
  <text x="155" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0b3c5d">matrix (dense or sparse)</text>
  <text x="155" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0b3c5d">row_order, column_order</text>
  <text x="155" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0b3c5d">row_linkage, column_linkage</text>
  <text x="155" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0b3c5d">(left, right, distance, leaves)</text>
  <text x="155" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#35617a">sciencekit, SciPy, R, SQL…</text>

  <!-- Arrow -->
  <line x1="282" y1="165" x2="352" y2="165" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="317" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#12403a">supplies</text>

  <!-- Validation -->
  <rect x="356" y="88" width="214" height="154" rx="12" fill="#fff4e6" stroke="#f4a261" stroke-width="2" filter="url(#shadow)"/>
  <text x="463" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#6b3a12">Validation</text>
  <text x="463" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b3a12">leaf appears once</text>
  <text x="463" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b3a12">indices in range and earlier</text>
  <text x="463" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b3a12">distances non-decreasing</text>
  <text x="463" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b3a12">order is a permutation</text>
  <text x="463" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#8a5a2b">InvalidClusterTree(axis, position)</text>

  <!-- Arrow -->
  <line x1="572" y1="165" x2="642" y2="165" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="607" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#12403a">draws</text>

  <!-- Recipe -->
  <rect x="646" y="70" width="284" height="190" rx="12" fill="#eef7ee" stroke="#2a9d8f" stroke-width="3" filter="url(#shadow)"/>
  <text x="788" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#12403a">SVClusteredHeatmapPlot</text>
  <text x="788" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#12403a">SVMark::Image — reordered cells</text>
  <text x="788" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#12403a">SVMark path primitives — 2 dendrograms</text>
  <text x="788" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#12403a">SVScale::Continuous — fill colour</text>
  <text x="788" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#12403a">SVColourBar decoration</text>
  <text x="788" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#1f5f57">SVG or native dispatch; streaming rejected</text>
</svg>

  <line x1="40" y1="330" x2="1000" y2="330" stroke="#d1d9e0" stroke-width="1"/>
  <text x="40" y="362" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700"
        fill="#1f2328">Continuous colour maps</text>
  <defs><linearGradient id="gradient-viridis" x1="0" x2="1"><stop offset="0.0000" stop-color="#440154"/><stop offset="0.2500" stop-color="#3b528b"/><stop offset="0.5000" stop-color="#21918c"/><stop offset="0.7500" stop-color="#5ec962"/><stop offset="1.0000" stop-color="#fde725"/></linearGradient></defs><text x="40" y="412" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2328">viridis</text><text x="150" y="412" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">sequential</text><rect x="210" y="390" width="760" height="34" rx="6" fill="url(#gradient-viridis)" stroke="#d1d9e0" stroke-width="1"/><defs><linearGradient id="gradient-magma" x1="0" x2="1"><stop offset="0.0000" stop-color="#000004"/><stop offset="0.2000" stop-color="#3b0f70"/><stop offset="0.4000" stop-color="#8c2981"/><stop offset="0.6000" stop-color="#de4968"/><stop offset="0.8000" stop-color="#fe9f6d"/><stop offset="1.0000" stop-color="#fcfdbf"/></linearGradient></defs><text x="40" y="486" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2328">magma</text><text x="150" y="486" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">sequential</text><rect x="210" y="464" width="760" height="34" rx="6" fill="url(#gradient-magma)" stroke="#d1d9e0" stroke-width="1"/><defs><linearGradient id="gradient-balance" x1="0" x2="1"><stop offset="0.0000" stop-color="#2166ac"/><stop offset="0.2500" stop-color="#67a9cf"/><stop offset="0.5000" stop-color="#f7f7f7"/><stop offset="0.7500" stop-color="#ef8a62"/><stop offset="1.0000" stop-color="#b2182b"/></linearGradient></defs><text x="40" y="560" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2328">balance</text><text x="150" y="560" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">diverging</text><rect x="210" y="538" width="760" height="34" rx="6" fill="url(#gradient-balance)" stroke="#d1d9e0" stroke-width="1"/><defs><linearGradient id="gradient-twilight" x1="0" x2="1"><stop offset="0.0000" stop-color="#e2d9e2"/><stop offset="0.1667" stop-color="#8b7aa8"/><stop offset="0.3333" stop-color="#4f4a7a"/><stop offset="0.5000" stop-color="#2a2a4a"/><stop offset="0.6667" stop-color="#4f4a7a"/><stop offset="0.8333" stop-color="#8b7aa8"/><stop offset="1.0000" stop-color="#e2d9e2"/></linearGradient></defs><text x="40" y="634" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2328">twilight</text><text x="150" y="634" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">cyclical</text><rect x="210" y="612" width="760" height="34" rx="6" fill="url(#gradient-twilight)" stroke="#d1d9e0" stroke-width="1"/>
  <text x="40" y="682" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">
    Categorical entries are assigned one per series and cycle; continuous stops are interpolated by a fraction.
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720"
     viewBox="0 0 1040 720" role="img"
     aria-labelledby="title description">
  <title id="title">Palettes compiled from the scienceview theme</title>
  <desc id="description">Two categorical palettes as discrete swatches and four
    continuous colour maps as gradients, all read from the authored stylesheet.</desc>
  <rect width="1040" height="720" fill="#ffffff"/>
  <rect x="24" y="24" width="992" height="672" rx="16" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="40" y="66" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700"
        fill="#1f2328">Palettes are theme data, not renderer literals</text>
  <text x="40" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#59636e">
    Every swatch below is read from crates/scienceview_theme/stylesheet/scienceview.scss
  </text>

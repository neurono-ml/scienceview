<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1120 660" role="img" aria-label="The transition lifecycle: two mark states are matched by typed keys into entry, update and exit sets, the update set interpolates only the interpolable properties while discrete properties swap at the end, and the caller-supplied progress produces one deterministic frame; reduced motion and a static backend both resolve the frame to the final state">
  <defs>
    <marker id="transition-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
    <marker id="transition-arrow-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="transition-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
    <linearGradient id="transition-background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="660" fill="url(#transition-background)"/>
  <text x="560" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1f2328">
    The enter / update / exit lifecycle
  </text>
  <text x="560" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#59636e">
    Marks are matched by a stable key, never by position; the caller supplies the progress, so the kernel owns no clock
  </text>

  <!-- State A -->
  <rect x="40" y="120" width="220" height="180" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0a3069">State A (previous)</text>
  <text x="150" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">SVMarkState per mark</text>
  <circle cx="90" cy="212" r="10" fill="#0969da"/>
  <text x="108" y="217" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">key 4 · (0, 0)</text>
  <circle cx="90" cy="246" r="10" fill="#0969da"/>
  <text x="108" y="251" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">key 5 · (10, 0)</text>
  <circle cx="90" cy="280" r="10" fill="#0969da"/>

  <!-- Key resolution -->
  <rect x="320" y="120" width="220" height="180" rx="14" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
  <text x="430" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#7d4e00">Resolve keys</text>
  <text x="430" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">SVMatchKeyValue is typed</text>
  <text x="430" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">Category · Index · Identity</text>
  <text x="430" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">Derived (seeded hash)</text>
  <text x="430" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7d4e00">one dispatch: dense, sparse, streaming</text>
  <text x="430" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7d4e00">a repeated key is rejected</text>

  <!-- State B -->
  <rect x="600" y="120" width="220" height="180" rx="14" fill="#f0fff4" stroke="#1a7f37" stroke-width="2"/>
  <text x="710" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f5323">State B (next)</text>
  <text x="710" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">SVMarkState per mark</text>
  <circle cx="650" cy="212" r="10" fill="#1a7f37"/>
  <text x="668" y="217" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">key 5 · (20, 0)</text>
  <circle cx="650" cy="246" r="10" fill="#1a7f37"/>
  <text x="668" y="251" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">key 6 · (30, 0)</text>

  <!-- Plan -->
  <rect x="880" y="120" width="200" height="180" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="2"/>
  <text x="980" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4c2889">SVTransitionPlan</text>
  <text x="980" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">updates: 5</text>
  <text x="980" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">enters: 6</text>
  <text x="980" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">exits: 4</text>
  <text x="980" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4c2889">pure, immutable, Send + Sync</text>

  <line x1="260" y1="210" x2="318" y2="210" stroke="#0969da" stroke-width="2" marker-end="url(#transition-arrow-cool)"/>
  <line x1="540" y1="210" x2="598" y2="210" stroke="#1a7f37" stroke-width="2" marker-end="url(#transition-arrow)"/>
  <line x1="820" y1="210" x2="878" y2="210" stroke="#8250df" stroke-width="2" marker-end="url(#transition-arrow)"/>

  <!-- Three sets -->
  <rect x="40" y="348" width="330" height="150" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="205" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f5323">Update — in both states</text>
  <text x="205" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">interpolable properties tween</text>
  <text x="205" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">position · size · colour · opacity · font size</text>
  <text x="205" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">discrete properties hold, then swap at 1.0</text>
  <text x="205" y="472" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">through SVEasing and the caller progress</text>

  <rect x="400" y="348" width="320" height="150" rx="14" fill="#f0fff4" stroke="#1a7f37" stroke-width="2"/>
  <text x="560" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f5323">Enter — only in B</text>
  <text x="560" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">None · FadeIn · ScaleIn · SlideIn</text>
  <text x="560" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">starts transparent, at zero size or below</text>
  <text x="560" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">reaches the target state at progress 1.0</text>
  <text x="560" y="472" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">drawn for the whole transition</text>

  <rect x="750" y="348" width="330" height="150" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="915" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#82071e">Exit — only in A</text>
  <text x="915" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">None · FadeOut · ScaleOut · SlideOut</text>
  <text x="915" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">mirror motion from the source state</text>
  <text x="915" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">dropped when the transition completes</text>
  <text x="915" y="472" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">a changed key is an exit plus an enter</text>

  <!-- Frame -->
  <rect x="230" y="530" width="660" height="100" rx="16" fill="#f6f8fa" stroke="#1d3557" stroke-width="2"/>
  <text x="560" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1d3557">SVTransitionFrame — deterministic and drawable</text>
  <text x="560" y="582" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">evaluate(progress ∈ 0..=1) · non-finite rejected · outside clamped · progress_at(elapsed) maps a duration</text>
  <text x="560" y="606" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#59636e">Reduced motion and a backend without in-place update both resolve to the final state</text>

  <line x1="205" y1="498" x2="430" y2="528" stroke="#1a7f37" stroke-width="2" marker-end="url(#transition-arrow)"/>
  <line x1="560" y1="498" x2="560" y2="528" stroke="#1a7f37" stroke-width="2" marker-end="url(#transition-arrow)"/>
  <line x1="915" y1="498" x2="700" y2="528" stroke="#cf222e" stroke-width="2" marker-end="url(#transition-arrow-warm)"/>
</svg>

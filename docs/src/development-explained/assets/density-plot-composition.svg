<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240" role="img" aria-label="The density-plot composition">
  <title>The density-plot composition</title>
  <desc>Data flows from the source through the kernel-density stat, the fixed grid, the continuous scale, and the line and area marks into the SVG or native serializer.</desc>
  <rect x="0" y="0" width="980" height="240" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="16" y="86" width="132" height="68" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="82" y="114" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#0a3069">SVDataSource</text>
  <text x="82" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0a3069">dense / sparse / stream</text>

  <line x1="148" y1="120" x2="206" y2="120" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="208" y="86" width="156" height="68" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="286" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#0f5323">SVStat::KernelDensity</text>
  <text x="286" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f5323">Gaussian / Epanechnikov</text>

  <line x1="364" y1="120" x2="422" y2="120" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="424" y="80" width="150" height="80" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="499" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#5d4300">(grid, density)</text>
  <text x="499" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d4300">fixed lattice, no move</text>
  <text x="499" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d4300">256 samples · cut 3</text>

  <line x1="574" y1="120" x2="632" y2="120" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="634" y="86" width="128" height="68" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="698" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#4b2b7a">SVScale</text>
  <text x="698" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b2b7a">continuous x and y</text>

  <line x1="762" y1="120" x2="820" y2="120" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="822" y="80" width="142" height="80" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="893" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#82071e">SVMark::Line</text>
  <text x="893" y="130" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#82071e">SVMark::Area</text>
  <text x="893" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#82071e">fill is optional</text>

  <text x="490" y="40" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1f2328">SVDensityPlot — one estimate per series, over one fixed grid</text>
  <text x="490" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#57606a">Every step is a core kernel; the recipe adds composition, grouping and policy, never a new variant.</text>
  <text x="490" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#57606a">SVG and Native serializers replay the same backend-agnostic scene.</text>
</svg>

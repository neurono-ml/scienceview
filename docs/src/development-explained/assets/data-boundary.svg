<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1080 640" role="img" aria-label="The scienceview data boundary: many sources enter through the open SVDataSource trait and are resolved into exactly one of three representations for a kernel that dispatches once">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e07a1f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#ffffff"/>

  <text x="540" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3557">
    The data boundary: open ingestion, closed representation
  </text>
  <text x="540" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5568">
    any producer enters through one trait · every kernel receives exactly one of three views · dispatch happens once
  </text>

  <!-- Sources column -->
  <text x="150" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8338ec">
    Producers
  </text>

  <rect x="30" y="120" width="240" height="58" rx="10" fill="#f3e8ff" stroke="#8338ec" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#5a189a">borrowed slices &amp; tables</text>
  <text x="150" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a189a">SVSliceColumn · SVDataTable</text>

  <rect x="30" y="192" width="240" height="58" rx="10" fill="#d7f2fa" stroke="#118ab2" stroke-width="2"/>
  <text x="150" y="217" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b5f7d">ndarray &amp; sprs views</text>
  <text x="150" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b5f7d">data-ndarray · data-sprs</text>

  <rect x="30" y="264" width="240" height="58" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="150" y="289" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#065f46">channels &amp; async producers</text>
  <text x="150" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#065f46">streaming · streaming-tokio</text>

  <rect x="30" y="336" width="240" height="58" rx="10" fill="#fff3d6" stroke="#e07a1f" stroke-width="2"/>
  <text x="150" y="361" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#9a4d00">third-party systems</text>
  <text x="150" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a4d00">implement SVDataSource</text>

  <!-- Trait -->
  <rect x="330" y="120" width="200" height="274" rx="14" fill="#8338ec" stroke="#5a189a" stroke-width="2"/>
  <text x="430" y="156" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">SVDataSource</text>
  <text x="430" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#f3e8ff">open trait</text>
  <line x1="350" y1="196" x2="510" y2="196" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="430" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f3e8ff">schema(): names + roles</text>
  <text x="430" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f3e8ff">reactivity(): Static ·</text>
  <text x="430" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f3e8ff">Observed · EventDriven · Manual</text>
  <text x="430" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f3e8ff">column(name)</text>
  <text x="430" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f3e8ff">→ SVColumnSnapshot</text>
  <line x1="350" y1="312" x2="510" y2="312" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="430" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f3e8ff">resolved once per operation</text>
  <text x="430" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f3e8ff">never blocks · never copies</text>
  <text x="430" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f3e8ff">into an owned array</text>

  <line x1="270" y1="149" x2="326" y2="149" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="221" x2="326" y2="221" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="293" x2="326" y2="293" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="365" x2="326" y2="365" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Views -->
  <text x="720" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#118ab2">
    SVColumnView — exactly one variant reaches the kernel
  </text>

  <rect x="570" y="120" width="300" height="76" rx="12" fill="#d7f2fa" stroke="#118ab2" stroke-width="2"/>
  <text x="590" y="148" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b5f7d">Dense(&amp;[f64])</text>
  <text x="590" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b5f7d">contiguous · borrowed · no copy</text>
  <text x="590" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b5f7d">the reference representation</text>

  <rect x="570" y="208" width="300" height="86" rx="12" fill="#fff3d6" stroke="#e07a1f" stroke-width="2"/>
  <text x="590" y="236" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a4d00">Sparse(SVSparseView)</text>
  <text x="590" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a4d00">indices + stored values · borrowed</text>
  <text x="590" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a4d00">implicit zeros are never written</text>
  <text x="590" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9a4d00">never densified</text>

  <rect x="570" y="306" width="300" height="88" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="590" y="334" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">Streaming(SVStreamingView)</text>
  <text x="590" y="356" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#065f46">borrowed snapshot of the window</text>
  <text x="590" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#065f46">sequence + dropped samples</text>
  <text x="590" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">never blocks the render thread</text>

  <line x1="530" y1="240" x2="566" y2="160" stroke="#118ab2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="256" x2="566" y2="252" stroke="#e07a1f" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="530" y1="280" x2="566" y2="346" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Kernel -->
  <rect x="930" y="160" width="120" height="220" rx="14" fill="#1d3557" stroke="#0f2233" stroke-width="2"/>
  <text x="990" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">kernel</text>
  <text x="990" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">dispatch()</text>
  <text x="990" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">exactly once</text>
  <line x1="950" y1="254" x2="1030" y2="254" stroke="#475569" stroke-width="1.5"/>
  <text x="990" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">one branch</text>
  <text x="990" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">zero further</text>
  <text x="990" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">resolution</text>

  <line x1="872" y1="158" x2="926" y2="220" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="872" y1="251" x2="926" y2="268" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="872" y1="350" x2="926" y2="318" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Window panel -->
  <rect x="30" y="432" width="1020" height="170" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="462" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3557">
    The streaming path: the only copy in the library, and it is bounded
  </text>

  <text x="56" y="492" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">producer thread or task</text>
  <rect x="56" y="502" width="200" height="56" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="156" y="526" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">push(sample)</text>
  <text x="156" y="545" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#065f46">owns the runtime</text>

  <line x1="260" y1="530" x2="310" y2="530" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="314" y="502" width="290" height="56" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="459" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">SVRollingWindow — bounded ring</text>
  <text x="459" y="544" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#065f46">drop-oldest · dropped_samples · sequence</text>

  <line x1="608" y1="530" x2="658" y2="530" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="662" y="502" width="250" height="56" rx="10" fill="#d7f2fa" stroke="#118ab2" stroke-width="2"/>
  <text x="787" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b5f7d">snapshot() — borrowed slice</text>
  <text x="787" y="544" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b5f7d">read: no wait, no unbounded growth</text>

  <line x1="916" y1="530" x2="966" y2="530" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="970" y="502" width="60" height="56" rx="10" fill="#1d3557" stroke="#0f2233" stroke-width="2"/>
  <text x="1000" y="526" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">kernel</text>
  <text x="1000" y="544" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">reads</text>

  <text x="56" y="588" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">
    An asynchronous producer is drained with try_recv / try_iter on read; the render thread only borrows the window and returns immediately.
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1120 620" role="img" aria-label="The fixed move pipeline: a data-space column and its keys feed one displacement move (stack, dodge, jitter or swarm), then a shift, then a normalisation, producing offsets, values, baselines and widths that the scale maps into display space; the sequence validates its order before any data is read">
  <defs>
    <marker id="move-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
    <marker id="move-arrow-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="move-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
    <linearGradient id="move-background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="620" fill="url(#move-background)"/>
  <text x="560" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1f2328">
    The fixed move pipeline
  </text>
  <text x="560" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#59636e">
    Positions stay in data space; the scale maps them afterwards, and the move never copies the values it displaces
  </text>

  <!-- Validation callout -->
  <rect x="40" y="96" width="1040" height="54" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
  <text x="60" y="119" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7d4e00">SVMoveSequence::new — validation before any data is read</text>
  <text x="60" y="139" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">Two moves in one stage ⇒ ConflictingMoveStage · a move after a later stage ⇒ MoveOrderViolation · options out of range ⇒ InvalidConfiguration</text>

  <!-- Input -->
  <rect x="40" y="190" width="210" height="110" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="145" y="219" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0a3069">SVMoveRequest</text>
  <text x="145" y="243" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">SVColumnView</text>
  <text x="145" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">dense · sparse · streaming</text>
  <text x="145" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">group keys + category keys</text>

  <!-- Stage 1 -->
  <rect x="300" y="176" width="270" height="300" rx="16" fill="#f0fff4" stroke="#1a7f37" stroke-width="2"/>
  <text x="435" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f5323">Stage 1 — displacement</text>
  <text x="435" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">exactly one of these four</text>

  <rect x="318" y="240" width="234" height="48" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="332" y="262" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f5323">Stack</text>
  <text x="332" y="278" font-family="system-ui, sans-serif" font-size="11" fill="#1f2328">baseline + top, positives up, negatives down</text>

  <rect x="318" y="298" width="234" height="48" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="332" y="320" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f5323">Dodge</text>
  <text x="332" y="336" font-family="system-ui, sans-serif" font-size="11" fill="#1f2328">offset + width from the group count</text>

  <rect x="318" y="356" width="234" height="48" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="332" y="378" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f5323">Jitter</text>
  <text x="332" y="394" font-family="system-ui, sans-serif" font-size="11" fill="#1f2328">seeded offset from the mark key, never the frame</text>

  <rect x="318" y="414" width="234" height="48" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="332" y="436" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f5323">Swarm</text>
  <text x="332" y="452" font-family="system-ui, sans-serif" font-size="11" fill="#1f2328">deterministic non-overlap, bounded attempts</text>

  <!-- Stage 2 -->
  <rect x="620" y="222" width="180" height="100" rx="14" fill="#ffeff1" stroke="#cf222e" stroke-width="2"/>
  <text x="710" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#82071e">Stage 2 — Shift</text>
  <text x="710" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">fixed amount, data units</text>
  <text x="710" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">horizontal or vertical</text>

  <!-- Stage 3 -->
  <rect x="620" y="356" width="180" height="100" rx="14" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="710" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#5b2b9e">Stage 3 — Normalize</text>
  <text x="710" y="409" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">group total from contributions</text>
  <text x="710" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">fraction 1 · percent 100</text>

  <!-- Output -->
  <rect x="850" y="222" width="230" height="234" rx="14" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
  <text x="965" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#7d2b00">SVMoveOutput</text>
  <text x="965" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">horizontal offsets</text>
  <text x="965" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">vertical offsets</text>
  <text x="965" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">values (None = untouched)</text>
  <text x="965" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">baselines · widths</text>
  <text x="965" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7d2b00">then sv_scale</text>
  <text x="965" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">data space → display space</text>
  <text x="965" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7d2b00">then SVMark</text>
  <text x="965" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">geometry only, no raster here</text>

  <!-- Arrows -->
  <line x1="250" y1="245" x2="300" y2="245" stroke="#1d3557" stroke-width="2.5" marker-end="url(#move-arrow)"/>
  <line x1="570" y1="272" x2="620" y2="272" stroke="#1d3557" stroke-width="2.5" marker-end="url(#move-arrow)"/>
  <line x1="710" y1="322" x2="710" y2="356" stroke="#1d3557" stroke-width="2.5" marker-end="url(#move-arrow)"/>
  <line x1="800" y1="406" x2="850" y2="360" stroke="#1d3557" stroke-width="2.5" marker-end="url(#move-arrow)"/>

  <!-- Footer -->
  <rect x="40" y="510" width="1040" height="80" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="536" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Determinism and the data boundary</text>
  <text x="60" y="557" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">Jitter and swarm hash the mark key with an in-crate SplitMix64 — 64-bit integer arithmetic only, identical on every platform, no dependency.</text>
  <text x="60" y="577" font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">One dispatch per column: dense reads a slice, sparse reads only its stored entries (an implicit zero keeps a zero baseline), streaming reads its bounded window.</text>
</svg>

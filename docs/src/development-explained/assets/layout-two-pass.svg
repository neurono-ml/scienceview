<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-label="Two passes: measure up, solve down, rasterize last">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.08"/>
  </filter>
</defs>
<rect width="1180" height="720" fill="#ffffff"/>
<text x="40" y="46" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1f2328">Two passes: measure up, solve down, rasterize last</text>

<rect x="60" y="90" width="260" height="100" rx="12" fill="#e7f0ff" stroke="#0969da" stroke-width="2"/>
<text x="190.0" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Viewport</text>
<text x="190.0" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">backend describes the environment</text>
<text x="190.0" y="166" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">size · pixel ratio · cell grid</text>
<rect x="370" y="90" width="360" height="100" rx="12" fill="#fff4e6" stroke="#f4a261" stroke-width="2"/>
<text x="550.0" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Responsiveness mode</text>
<text x="550.0" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">fixed · fit to parent · aspect-ratio · content</text>
<rect x="60" y="250" width="300" height="130" rx="12" fill="#eef7ee" stroke="#2a9d8f" stroke-width="2"/>
<text x="210.0" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Pass 1 — measure</text>
<text x="210.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">bottom-up</text>
<text x="210.0" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">leaves report intrinsic size</text>
<text x="210.0" y="346" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">containers sum + gaps + padding</text>
<rect x="430" y="250" width="300" height="130" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="580.0" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Pass 2 — solve</text>
<text x="580.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">top-down</text>
<text x="580.0" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">lengths, then fill shares</text>
<text x="580.0" y="346" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">clamp to constraints</text>
<rect x="800" y="250" width="320" height="130" rx="12" fill="#fde8ef" stroke="#ef4766" stroke-width="2"/>
<text x="960.0" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Resolved layout tree</text>
<text x="960.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">SVResolvedLayout</text>
<text x="960.0" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">rectangles in logical pixels</text>
<text x="960.0" y="346" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">revision marks a re-solve</text>
<line x1="300" y1="160" x2="520" y2="250" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="550" y1="190" x2="550" y2="250" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="550.0" y="210.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">chooses the root box</text>
<line x1="360" y1="315" x2="430" y2="315" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="730" y1="315" x2="800" y2="315" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="420" width="800" height="140" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="84" y="452" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Why two passes and not one?</text>
<text x="84" y="480" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#59636e">Measurement never reads the viewport, so intrinsic sizes are stable.</text>
<text x="84" y="504" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#59636e">Solving never re-measures: the viewport is the only environment input.</text>
<text x="84" y="528" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#59636e">The tree stays continuous; a terminal snaps only the final raster.</text>
<text x="60" y="592" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Backends rasterize the same tree</text>
<rect x="60" y="610" width="245" height="66" rx="12" fill="#e7f0ff" stroke="#0969da" stroke-width="2"/>
<text x="182.5" y="640" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f2328">SVG</text>
<rect x="335" y="610" width="245" height="66" rx="12" fill="#eef7ee" stroke="#2a9d8f" stroke-width="2"/>
<text x="457.5" y="640" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f2328">Native / WASM</text>
<rect x="610" y="610" width="245" height="66" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="732.5" y="640" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f2328">Terminal cells</text>
<rect x="885" y="610" width="245" height="66" rx="12" fill="#fff4e6" stroke="#f4a261" stroke-width="2"/>
<text x="1007.5" y="640" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f2328">HTML / frameworks</text>
<line x1="960" y1="380" x2="960" y2="610" stroke="#59636e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="960.0" y="485.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">snap only the final raster</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520"
     viewBox="0 0 1080 520" role="img"
     aria-labelledby="title description">
  <title id="title">The theme compilation pipeline</title>
  <desc id="description">The stylesheet is parsed by one dependency-free parser.
    At build time it becomes typed Rust tokens; at runtime it becomes the same
    value and replaces the tokens inside a shared handle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="1080" height="520" fill="#ffffff"/>
  <rect x="24" y="24" width="1032" height="472" rx="16" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="48" y="70" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700"
        fill="#1f2328">One authored source, two compilation moments</text>

  <rect x="48" y="110" width="250" height="110" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="68" y="145" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">stylesheet/scienceview.scss</text>
  <text x="68" y="172" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">$colour.background: #ffffff;</text>
  <text x="68" y="192" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">$palette.sequential.viridis: …</text>

  <rect x="376" y="110" width="280" height="110" rx="12" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
  <text x="396" y="145" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Dependency-free parser</text>
  <text x="396" y="172" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">build_support/parser.rs</text>
  <text x="396" y="192" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">shared by both paths</text>

  <rect x="742" y="96" width="280" height="70" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="762" y="126" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2328">build.rs → typed Rust</text>
  <text x="762" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">SVThemeTokens + SVColourPalettes</text>

  <rect x="742" y="200" width="280" height="70" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="762" y="230" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2328">runtime compiler (opt-in)</text>
  <text x="762" y="252" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">same parser, same validation</text>

  <rect x="376" y="330" width="646" height="96" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="396" y="362" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2328">SVTheme — a cheaply cloneable handle</text>
  <text x="396" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">tokens() · palettes() · resolve("spacing.medium") · recompile(source)</text>
  <text x="396" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">Recompiling replaces the value in place: every figure holding a clone restyles.</text>

  <rect x="48" y="330" width="280" height="96" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="68" y="362" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Backends</text>
  <text x="68" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">SVG · HTML · TUI · native · WASM</text>
  <text x="68" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#59636e">read fields, never parse source</text>

  <line x1="298" y1="165" x2="368" y2="165" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656" y1="145" x2="734" y2="131" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656" y1="185" x2="734" y2="225" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="882" y1="166" x2="882" y2="192" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="882" y1="270" x2="882" y2="322" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="376" y1="378" x2="336" y2="378" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

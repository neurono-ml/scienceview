<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" role="img" aria-label="One length model, five declarations">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.08"/>
  </filter>
</defs>
<rect width="1180" height="540" fill="#ffffff"/>
<text x="40" y="46" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1f2328">One length model, five declarations</text>

<text x="40" y="78" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#59636e">Each box declares one axis. The solver resolves it against the parent and the measured content, then clamps it.</text>
<rect x="40" y="100" width="200" height="118" rx="12" fill="#e7f0ff" stroke="#0969da" stroke-width="2"/>
<text x="140.0" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Absolute</text>
<text x="140.0" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">320 px</text>
<text x="140.0" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">never moves</text>
<rect x="264" y="100" width="200" height="118" rx="12" fill="#fff4e6" stroke="#f4a261" stroke-width="2"/>
<text x="364.0" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Fraction</text>
<text x="364.0" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">0.5 × parent</text>
<text x="364.0" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">0.0 ≤ f ≤ 1.0</text>
<rect x="488" y="100" width="200" height="118" rx="12" fill="#eef7ee" stroke="#2a9d8f" stroke-width="2"/>
<text x="588.0" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Intrinsic</text>
<text x="588.0" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">measured content</text>
<text x="588.0" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">from the leaves up</text>
<rect x="712" y="100" width="200" height="118" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="812.0" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">AspectRatio</text>
<text x="812.0" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">ratio = width / height</text>
<text x="812.0" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">derives the other axis</text>
<rect x="936" y="100" width="200" height="118" rx="12" fill="#fde8ef" stroke="#ef4766" stroke-width="2"/>
<text x="1036.0" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Fill</text>
<text x="1036.0" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">remaining space</text>
<text x="1036.0" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1f2328">shared by siblings</text>
<rect x="40" y="290" width="1100" height="120" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="64" y="322" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Constraints bracket every resolved size</text>
<text x="64" y="348" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#59636e">minimum_width / maximum_width · minimum_height / maximum_height</text>
<line x1="90" y1="382" x2="1010" y2="382" stroke="#d0d7de" stroke-width="3"/>
<circle cx="90" cy="382" r="7" fill="#59636e"/>
<text x="90" y="406" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">0</text>
<circle cx="360" cy="382" r="7" fill="#2a9d8f"/>
<text x="360" y="406" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">minimum</text>
<circle cx="700" cy="382" r="7" fill="#0969da"/>
<text x="700" y="406" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">candidate</text>
<circle cx="1010" cy="382" r="7" fill="#ef4766"/>
<text x="1010" y="406" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#59636e">maximum</text>
<text x="590" y="466" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#1f2328">Contradiction rule: when minimum &gt; maximum, the minimum wins — deterministically, without a panic.</text>
<text x="590" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#59636e">Non-finite values become zero; an unbounded maximum stays unbounded.</text>
</svg>

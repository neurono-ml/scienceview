<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title description">
  <title id="title">The animation playback state machine</title>
  <desc id="description">Idle becomes Playing on play. Playing and Paused swap on pause and play. Playing becomes Finished when a fixed timeline reaches its last frame with no pass left. Finished restarts at the beginning on play. A streaming timeline never reaches Finished: it waits at its newest keyframe.</desc>
  <style>
    .title { font: 700 22px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1c2733; }
    .note { font: 400 13px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #4a5866; }
    .state { font: 700 17px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .detail { font: 400 12px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .edge { font: 600 12px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #35424f; }
    .flow { stroke: #5d6b78; stroke-width: 2; fill: none; }
    .dashed { stroke-dasharray: 7 5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b78"/>
    </marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.12" flood-color="#1c2733"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="470" rx="18" fill="#f7fafc"/>
  <text class="title" x="40" y="44">One clock, four states</text>
  <text class="note" x="40" y="68">The timeline advances only through advance(Duration); nothing here owns a wall clock.</text>

  <g filter="url(#soft)">
    <rect x="80" y="190" width="170" height="86" rx="16" fill="#fff4e6" stroke="#f4a261" stroke-width="2.5"/>
    <text class="state" x="165" y="222" text-anchor="middle" fill="#6b3a12">Idle</text>
    <text class="detail" x="165" y="244" text-anchor="middle" fill="#8a5426">never played</text>
    <text class="detail" x="165" y="262" text-anchor="middle" fill="#8a5426">or stopped</text>
  </g>

  <g filter="url(#soft)">
    <rect x="365" y="190" width="170" height="86" rx="16" fill="#e3f2fd" stroke="#118ab2" stroke-width="2.5"/>
    <text class="state" x="450" y="222" text-anchor="middle" fill="#0b3c5d">Playing</text>
    <text class="detail" x="450" y="244" text-anchor="middle" fill="#155e82">position moves</text>
    <text class="detail" x="450" y="262" text-anchor="middle" fill="#155e82">a stream re-targets</text>
  </g>

  <g filter="url(#soft)">
    <rect x="650" y="190" width="180" height="86" rx="16" fill="#eef7ee" stroke="#2a9d8f" stroke-width="2.5"/>
    <text class="state" x="740" y="222" text-anchor="middle" fill="#12403a">Paused</text>
    <text class="detail" x="740" y="244" text-anchor="middle" fill="#1c6b60">position held</text>
    <text class="detail" x="740" y="262" text-anchor="middle" fill="#1c6b60">a stream waits</text>
  </g>

  <g filter="url(#soft)">
    <rect x="365" y="350" width="170" height="80" rx="16" fill="#fde8ef" stroke="#ef4766" stroke-width="2.5"/>
    <text class="state" x="450" y="381" text-anchor="middle" fill="#6b0f2a">Finished</text>
    <text class="detail" x="450" y="403" text-anchor="middle" fill="#8f2340">fixed source, last frame</text>
  </g>

  <line class="flow" x1="250" y1="233" x2="360" y2="233" marker-end="url(#arrow)"/>
  <text class="edge" x="305" y="222" text-anchor="middle">play()</text>

  <line class="flow" x1="535" y1="222" x2="645" y2="222" marker-end="url(#arrow)"/>
  <text class="edge" x="590" y="211" text-anchor="middle">pause()</text>

  <path class="flow" d="M 650 250 C 610 300, 530 300, 490 285" marker-end="url(#arrow)"/>
  <text class="edge" x="565" y="301" text-anchor="middle">play()</text>

  <line class="flow" x1="450" y1="278" x2="450" y2="345" marker-end="url(#arrow)"/>
  <text class="edge" x="505" y="315" text-anchor="middle">advance past the end</text>

  <path class="flow" d="M 365 405 C 250 405, 145 330, 150 280" marker-end="url(#arrow)"/>
  <text class="edge" x="235" y="380" text-anchor="middle">play() restarts at the first frame</text>

  <path class="flow dashed" d="M 395 185 C 340 110, 210 110, 165 185" stroke="#d97706" marker-end="url(#arrow-warm)"/>
  <text class="edge" x="280" y="112" text-anchor="middle" fill="#a4530a">stop() returns to Idle</text>

  <text class="note" x="40" y="448">Loop::Count(n) repeats the finish; Loop::Forever and every streaming timeline never reach Finished.</text>
</svg>

# The root package is a facade: it re-exports the core crate and every backend
# crate whose feature is enabled. Every rendering backend is a Cargo feature and
# maps 1:1 to a workspace crate under crates/scienceview_* (see PRD §3.1).
# Enabling a feature only makes the backend available; selecting it is always
# explicit through `backend(...)` on the figure/artist builder — there is no
# automatic backend. Rendering is commanded by the `SVRenderBackend` trait, so
# new backends (including third-party crates) plug in without touching the core.
[features]
default = []
# Borrowed slices are the core data model; ndarray views are opt-in.
data-ndarray = ["dep:ndarray", "scienceview_core/data-ndarray"]
# Zero-copy views over `sprs` sparse vectors.
data-sprs = ["scienceview_core/data-sprs"]
# Opt-in JSON serialization of the figure specification.
spec-serde = ["dep:serde", "dep:serde_json"]
# Design tokens: one authored theme compiled into backend-independent tokens.
theme = ["dep:scienceview_theme", "scienceview_core/theme"]
# Recompile a theme while the program runs; absent, the build-time theme is used.
theme-runtime-compilation = ["theme", "scienceview_theme/theme-runtime-compilation"]
# One feature per rendering backend, one crate per feature.
render-svg = ["dep:scienceview_svg"]
render-html = ["dep:scienceview_html"]
render-tui = ["dep:scienceview_tui"]
render-native = ["dep:scienceview_native", "scienceview_native/window"]
render-react = ["dep:scienceview_react"]
render-vue = ["dep:scienceview_vue"]
render-angular = ["dep:scienceview_angular"]
render-tauri = ["dep:scienceview_tauri"]
render-dioxus = ["dep:scienceview_dioxus"]
wasm = ["dep:scienceview_wasm"]
# Live updates over standard-library channels; no async runtime in core.
streaming = ["scienceview_core/streaming"]
# Live updates over Tokio watch channels.
streaming-tokio = ["dep:tokio", "scienceview_core/streaming-tokio"]

[dependencies]
scienceview_core = { path = "crates/scienceview_core", version = "0.1.0" }
tracing = "0.1"
scienceview_theme = { path = "crates/scienceview_theme", version = "0.1.0", optional = true }
ndarray = { version = "0.17", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["sync"] }

scienceview_svg = { path = "crates/scienceview_svg", version = "0.1.0", optional = true }
scienceview_html = { path = "crates/scienceview_html", version = "0.1.0", optional = true }
scienceview_tui = { path = "crates/scienceview_tui", version = "0.1.0", optional = true }
scienceview_native = { path = "crates/scienceview_native", version = "0.1.0", optional = true }
scienceview_wasm = { path = "crates/scienceview_wasm", version = "0.1.0", optional = true }
scienceview_react = { path = "crates/scienceview_react", version = "0.1.0", optional = true }
scienceview_vue = { path = "crates/scienceview_vue", version = "0.1.0", optional = true }
scienceview_angular = { path = "crates/scienceview_angular", version = "0.1.0", optional = true }
scienceview_tauri = { path = "crates/scienceview_tauri", version = "0.1.0", optional = true }
scienceview_dioxus = { path = "crates/scienceview_dioxus", version = "0.1.0", optional = true }

[lints]
workspace = true

[dev-dependencies]
scienceview_svg = { path = "crates/scienceview_svg", version = "0.1.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

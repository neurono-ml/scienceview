[workspace]
resolver = "3"
members = [
    "crates/scienceview_core",
    "crates/scienceview_svg",
    "crates/scienceview_html",
    "crates/scienceview_tui",
    "crates/scienceview_native",
    "crates/scienceview_wasm",
    "crates/scienceview_react",
    "crates/scienceview_vue",
    "crates/scienceview_angular",
    "crates/scienceview_tauri",
    "crates/scienceview_dioxus",
    "crates/scienceview_theme",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neurono-ml/scienceview"
homepage = "https://neurono-ml.github.io/scienceview"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[package]
name = "scienceview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scientific visualization for Rust: builder-style figures with styling, interactivity and streaming updates across native, HTML, WebAssembly and terminal targets."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/scienceview"
keywords = ["visualization", "plotting", "charts", "streaming", "tui"]
categories = ["visualization", "science"]

[lib]
name = "scienceview"
path = "src/lib.rs"

# Charts that call the public serializers declare the backend feature that
# compiles them as a required feature.
# Charts that call the public serializers declare the backend feature that
# compiles them as a required feature.
# Charts that call the public serializers declare the backend feature that
# compiles them as a required feature.
# Charts that call the public serializers declare the backend feature that

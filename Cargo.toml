[[example]]
name = "histogram_plot"
path = "examples/histogram_plot.rs"
required-features = ["render-svg"]

[[example]]
name = "swarm_plot"
path = "examples/swarm_plot.rs"
required-features = ["render-svg"]

[[example]]
name = "strip_plot"
required-features = ["render-svg"]

[[example]]
name = "bar_plot"
